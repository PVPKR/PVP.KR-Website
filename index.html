<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PVP.KR - 쿠키런: 브레이버스 토너먼트 결과 및 분석</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css?v=20260211">

    <!-- SEO & Metadata -->
    <meta name="description" content="쿠키런 브레이버스 토너먼트 분석 및 메타 순위 정보">
    <meta property="og:title" content="PVP.KR - 쿠키런: 브레이버스 토너먼트 결과 및 분석">
    <meta property="og:description" content="최신 우승 덱 리스트와 토너먼트 분석 데이터를 확인하세요.">
    <meta property="og:image" content="assets/images/pvpkr_logo.webp">
    <meta property="og:type" content="website">
    <link rel="shortcut icon" href="assets/images/pvpkr_logo.webp" type="image/x-icon">
</head>

<body>
    <header
        class="bg-[var(--header-bg)] sticky top-0 z-50 backdrop-blur-md border-b border-[var(--header-border)] shadow-lg transition-colors duration-300">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-4 cursor-pointer group" onclick="renderHome()">
                <div class="relative">
                    <img src="assets/images/pvpkr_logo.webp" alt="PVP.KR Logo"
                        class="relative w-14 h-14 object-contain">
                </div>
                <div class="hidden sm:block">
                    <h1 class="text-3xl font-black gradient-text tracking-tighter">PVP.KR</h1>
                    <p
                        class="text-[10px] text-[var(--text-muted)] font-bold uppercase tracking-widest mt-0.5 opacity-80">
                        Tournament Results & Analytics</p>
                </div>
            </div>
            <!-- Desktop Search Bar -->
            <div class="hidden lg:flex flex-1 max-w-sm mx-10 relative group">
                <input type="text" id="header-search-input" placeholder="Search players..."
                    class="w-full bg-white/5 hover:bg-white/10 border border-white/10 group-hover:border-white/20 rounded-full px-5 py-2.5 text-sm text-white placeholder-white/30 focus:outline-none focus:border-purple-500/50 focus:bg-white/10 transition-all font-bold">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                    class="absolute right-4 top-3 text-white/40 group-focus-within:text-purple-400 transition-colors">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.3-4.3"></path>
                </svg>
            </div>

            <nav class="hidden md:flex gap-8 items-center font-bold text-[var(--nav-text)] ml-auto">
                <a href="#tournaments-section" id="nav-tournaments" class="hover:text-purple-400 transition"
                    onclick="if(window.location.hash !== '') { renderHome(); setTimeout(() => document.getElementById('tournaments-section').scrollIntoView({behavior: 'smooth'}), 100); }">Tournaments</a>
                <a href="#players" id="nav-players" class="hover:text-purple-400 transition"
                    onclick="if(window.location.hash === '#players') { renderPlayersDirectory(); }">Players</a>
                <a href="#stores" id="nav-stores" class="hover:text-purple-400 transition text-purple-200"
                    onclick="if(window.location.hash === '#stores') { renderStoresDirectory(); }">Stores (Beta)</a>

                <div id="auth-container" class="ml-2">
                    <button onclick="openAuthModal()"
                        class="px-5 py-2 bg-white/5 hover:bg-white/10 text-white rounded-full border border-white/10 transition-all font-bold text-sm backdrop-blur-sm">
                        Login
                    </button>
                </div>

                <div class="flex items-center gap-2 bg-white/5 px-3 py-1.5 rounded-full border border-white/10 ml-4">
                    <button id="lang-ko" onclick="setLanguage('ko')"
                        class="text-xs transition-colors duration-200">KO</button>
                    <div class="w-[1px] h-3 bg-white/20"></div>
                    <button id="lang-en" onclick="setLanguage('en')"
                        class="text-xs opacity-40 hover:opacity-100 transition-colors duration-200">EN</button>
                </div>
            </nav>

            <!-- Mobile Search Bar (Header) -->
            <div class="flex md:hidden flex-1 mx-4 relative group">
                <input type="text" id="mobile-header-search-input" placeholder="Search..."
                    class="w-full bg-white/5 hover:bg-white/10 border border-white/10 group-hover:border-white/20 rounded-full px-4 py-2 text-sm text-white placeholder-white/30 focus:outline-none focus:border-purple-500/50 focus:bg-white/10 transition-all font-bold">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                    class="absolute right-3 top-2.5 text-white/40 group-focus-within:text-purple-400 transition-colors">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.3-4.3"></path>
                </svg>
            </div>

            <!-- Mobile Menu Toggle -->
            <button id="mobile-menu-toggle" onclick="toggleMobileMenu()"
                class="md:hidden text-white hover:text-purple-400 transition" aria-label="Toggle Menu">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
        </div>

        <!-- Mobile Menu Dropdown -->
        <div id="mobile-menu"
            class="flex flex-col md:hidden absolute top-full left-0 w-full bg-[var(--header-bg)] border-b border-[var(--header-border)] backdrop-blur-xl shadow-2xl transition-all duration-300 origin-top transform scale-y-0 opacity-0 pointer-events-none z-40">
            <div class="px-6 py-8 flex flex-col gap-6">
                <!-- Mobile Navigation Links -->
                <a href="#tournaments-section" id="mobile-nav-tournaments"
                    class="text-white font-bold text-xl hover:text-purple-400 transition"
                    onclick="toggleMobileMenu(); if(window.location.hash !== '') { renderHome(); setTimeout(() => document.getElementById('tournaments-section').scrollIntoView({behavior: 'smooth'}), 100); }">
                    Tournaments
                </a>
                <a href="#players" id="mobile-nav-players"
                    class="text-white font-bold text-xl hover:text-purple-400 transition"
                    onclick="toggleMobileMenu(); if(window.location.hash === '#players') { renderPlayersDirectory(); }">
                    Players
                </a>
                <a href="#stores" id="mobile-nav-stores"
                    class="text-white font-bold text-xl hover:text-purple-400 transition text-purple-200"
                    onclick="toggleMobileMenu(); if(window.location.hash === '#stores') { renderStoresDirectory(); }">
                    Stores (Beta)
                </a>

                <!-- Mobile Auth Container -->
                <div id="mobile-auth-container" class="pt-4 border-t border-[var(--header-border)]">
                    <button onclick="toggleMobileMenu(); openAuthModal()"
                        class="w-full px-5 py-4 bg-white/5 hover:bg-white/10 text-white rounded-xl border border-white/10 transition-all font-bold text-lg backdrop-blur-sm text-center">
                        Login
                    </button>
                </div>

                <!-- Mobile Language Toggle -->
                <div
                    class="flex items-center justify-center gap-6 bg-white/5 px-4 py-3 rounded-xl border border-white/10 mx-auto w-full">
                    <button id="mobile-lang-ko" onclick="setLanguage('ko'); toggleMobileMenu()"
                        class="font-bold transition-colors duration-200 text-base">KO</button>
                    <div class="w-[1px] h-5 bg-white/20"></div>
                    <button id="mobile-lang-en" onclick="setLanguage('en'); toggleMobileMenu()"
                        class="font-bold opacity-40 text-base hover:opacity-100 transition-colors duration-200">EN</button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-12">
        <div id="main-view" class="space-y-20">
            <!-- Top Decks Section -->
            <section>
                <div class="flex items-center gap-3 mb-10">
                    <div class="w-2 h-8 bg-purple-600 rounded-full"></div>
                    <h2 id="section-top-decks" class="text-4xl font-black text-white tracking-tight">Top
                        Decks (BS8~BS9)
                    </h2>
                </div>

                <div id="top-decks-grid" class="grid grid-cols-2 md:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-8">
                    <!-- Loaded via JS -->
                </div>
            </section>

            <!-- Grid Layout for Lists -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-16">
                <div class="space-y-12">
                    <div id="tournaments-section">
                        <div class="flex items-center gap-3 mb-6">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="text-purple-400">
                                <rect width="18" height="18" x="3" y="4" rx="2" ry="2" />
                                <line x1="16" y1="2" x2="16" y2="6" />
                                <line x1="8" y1="2" x2="8" y2="6" />
                                <line x1="3" y1="10" x2="21" y2="10" />
                            </svg>
                            <h2 id="section-recent-tournaments" class="text-2xl font-black text-white">
                                최근 토너먼트</h2>
                        </div>
                        <div id="recent-tournaments-list" class="space-y-4">
                            <!-- Loaded via JS -->
                        </div>
                    </div>

                    <div>
                        <div class="flex items-center gap-3 mb-6">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="text-yellow-400">
                                <polygon
                                    points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
                            </svg>
                            <h2 id="section-upcoming-tournaments" class="text-2xl font-black text-white">다가올 토너먼트</h2>
                        </div>
                        <div id="upcoming-tournaments-list" class="space-y-4">
                            <!-- Loaded via JS -->
                        </div>
                    </div>
                </div>

                <div class="space-y-8">
                    <div>
                        <div class="flex items-center gap-3 mb-6">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="text-green-400">
                                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                                <circle cx="9" cy="7" r="4" />
                                <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
                                <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                            </svg>
                            <h2 id="section-brave-league" class="text-2xl font-black text-white">2월 브레이브
                                리그</h2>
                        </div>
                        <div id="brave-league-list" class="grid grid-cols-1 gap-4">
                            <!-- Loaded via JS -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Detail View Container (Hidden by default) -->
        <div id="detail-view" class="hidden animate-in fade-in duration-300">
            <!-- Loaded via JS -->
        </div>
    </main>

    <footer class="bg-slate-950 border-t border-white/5 py-12 mt-20">
        <div class="max-w-7xl mx-auto px-6 text-center">
            <h2 class="text-2xl font-black gradient-text mb-6">PVP.KR</h2>

            <div class="flex flex-col items-center gap-6">
                <div>
                    <p id="footer-contact"
                        class="text-[10px] uppercase tracking-[0.2em] text-slate-500 font-black mb-4">Contact Us</p>
                    <div class="flex items-center gap-6 justify-center">
                        <a href="mailto:pvpkr@proton.me"
                            class="flex items-center gap-2 text-sm font-bold text-slate-400 hover:text-purple-400 transition">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <rect width="20" height="16" x="2" y="4" rx="2" />
                                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
                            </svg>
                            pvpkr@proton.me
                        </a>
                        <a href="https://x.com/PVPKR_official" target="_blank"
                            class="flex items-center gap-2 text-sm font-bold text-slate-400 hover:text-blue-400 transition">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path
                                    d="M22 4s-.7 2.1-2 3.4c1.6 10-9.4 17.3-18 11.6 2.2.1 4.4-.6 6-2C3 15.5.5 9.6 3 5c2.2 2.6 5.6 4.1 9 4-.9-4.2 4-6.6 7-3.8 1.1 0 3-1.2 3-1.2z" />
                            </svg>
                            @PVPKR_official
                        </a>
                    </div>
                </div>

                © 2026 PVP.KR. <span id="footer-rights">All rights reserved.</span>

            </div>
        </div>
    </footer>

    <!-- External Script -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>

    <!-- Auth Modal -->
    <div id="auth-modal" class="fixed inset-0 z-[100] hidden">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeAuthModal()"></div>
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-full max-w-md p-6">
            <div class="glass-card p-8 relative animate-in fade-in zoom-in duration-300">
                <button onclick="closeAuthModal()"
                    class="absolute top-4 right-4 text-slate-400 hover:text-white transition">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>

                <h2 id="auth-modal-title" class="text-3xl font-black mb-8 text-center gradient-text">Welcome Back</h2>

                <form id="auth-form" class="space-y-6">
                    <div>
                        <label class="block text-sm font-bold text-slate-400 mb-2">Email Address</label>
                        <input type="email" id="email" required
                            class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:border-purple-500 transition text-white placeholder-slate-600">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-400 mb-2">Password</label>
                        <input type="password" id="password" required
                            class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:border-purple-500 transition text-white placeholder-slate-600">
                    </div>
                    <button type="submit" id="auth-submit"
                        class="w-full py-4 bg-purple-600 hover:bg-purple-500 text-white font-black rounded-xl shadow-lg shadow-purple-900/20 transition-all active:scale-[0.98]">
                        Sign In
                    </button>
                    <div id="auth-error" class="hidden text-rose-400 text-sm font-bold text-center mt-2"></div>
                </form>

                <div class="mt-8 pt-8 border-t border-slate-800 text-center">
                    <p id="auth-toggle-text" class="text-slate-400 text-sm">
                        Don't have an account?
                        <button id="auth-toggle-btn" class="text-purple-400 font-bold hover:underline ml-1">Create
                            one</button>
                    </p>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
